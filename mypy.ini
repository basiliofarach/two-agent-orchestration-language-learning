[mypy]
python_version = 3.12
strict = true
pretty = true
show_error_codes = true
explicit_package_bases = true
mypy_path = $MYPY_CONFIG_FILE_DIR/tutor-core/src
exclude = (?x)(tests/fixtures/)

# pyarrow ships no stubs or py.typed. Only ParquetColumns (tutor-sim build)
# imports it, and that class types what it returns.
[mypy-pyarrow.*]
ignore_missing_imports = True
