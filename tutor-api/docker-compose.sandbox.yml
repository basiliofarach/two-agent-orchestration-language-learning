# Throwaway Postgres for `make sandbox-test`. Not the operator stack.
# No ${...} interpolation: Compose would otherwise read tutor-api/.env and
# bind the operator port and the postgres-data volume.
name: tutor-sandbox

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: sandbox_owner
      POSTGRES_PASSWORD: sandbox_owner
      POSTGRES_DB: sandbox
      POSTGRES_APP_USER: sandbox_app
      POSTGRES_APP_PASSWORD: sandbox_app
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - sandbox-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_parameter_max_length=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_owner -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sandbox-data:
