[project]
name = "tutor-api"
version = "0.1.0"
description = "HTTP and infrastructure adapters."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "tutor-core",
    "uvicorn>=0.30",
]

[project.scripts]
# `uv run tutor-api` serves the API. Uvicorn is the ASGI server inside it.
tutor-api = "tutor_api.serve:ApiServer.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tutor-core = { workspace = true }

[tool.pylint.main]
source-roots = ["src", "../tutor-core/src"]

[tool.pylint.imports]
known-first-party = ["tutor_core", "tutor_api"]
init-hook = "import sys; from pathlib import Path; root = next((p for p in [Path.cwd(), *Path.cwd().parents] if (p / 'uv.lock').is_file()), None); sys.path[:0] = [str(root / 'tutor-core' / 'src'), str(root / 'tutor-api' / 'src')] if root is not None else []"
