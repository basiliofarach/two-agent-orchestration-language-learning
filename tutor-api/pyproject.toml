[project]
name = "tutor-api"
version = "0.1.0"
description = "HTTP and infrastructure adapters."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "tutor-core",
    "uvicorn>=0.30",
]

[project.scripts]
# `uv run tutor-api` serves the API. Uvicorn is the ASGI server inside it.
tutor-api = "tutor_api.serve:ApiServer.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tutor-core = { workspace = true }
