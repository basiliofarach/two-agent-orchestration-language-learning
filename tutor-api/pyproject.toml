[project]
name = "tutor-api"
version = "0.1.0"
description = "HTTP and infrastructure adapters."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "psycopg[binary]>=3.2",
    "tutor-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tutor-core = { workspace = true }
