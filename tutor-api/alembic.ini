[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = src

# The filename carries a UTC YYYYMMDDHHMM stamp for ordering, then Alembic's
# revision hash, then the message slug. The stamp orders the directory; the hash
# is the identity, so two revisions written in the same minute cannot collide.
# Example: 202609221001_4245bb4476ff_base_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
# No sqlalchemy.url here on purpose. env.py resolves it from DATABASE_URL or
# the POSTGRES_* values in tutor-api/.env, so the credentials are not committed
# and cannot drift from the roles docker/postgres/init provisions. A caller
# that sets the option itself — the integration suite pointing at a
# testcontainer — still wins.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# Ruff runs the moment Alembic writes a revision, so a generated script is never
# committed in the stock template's shape (7 violations under ruff.toml: legacy
# `Union`, unused `op`/`sa`, single quotes). The repo ruff.toml governs the rules
# — these hooks only choose when it runs. `check --fix` first, then `format`;
# reversing them reformats code that the fixer is about to rewrite.
# `%(here)s` is this file's directory; the workspace venv is one level up.
[post_write_hooks]
hooks = ruff_check,ruff_format

ruff_check.type = exec
ruff_check.executable = %(here)s/../.venv/bin/ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = %(here)s/../.venv/bin/ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
