[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = src

# The filename carries a UTC YYYYMMDDHHMM stamp for ordering, then Alembic's
# revision hash, then the message slug. The stamp orders the directory; the hash
# is the identity, so two revisions written in the same minute cannot collide.
# Example: 202609221001_4245bb4476ff_base_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = postgresql+psycopg://tutor:tutor@127.0.0.1:5433/tutor

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
