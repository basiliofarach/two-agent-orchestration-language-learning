[project]
name = "supervised-two-agent-tutor"
version = "0.1.0"
description = "Compliance-evidence prototype for EU AI Act Articles 10, 12, 14 and 15."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tutor-core",
    "tutor-api",
]

[tool.uv]
required-version = ">=0.12.5"

[tool.uv.workspace]
members = ["tutor-core", "tutor-api"]

[tool.uv.sources]
tutor-core = { workspace = true }
tutor-api = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.3",
    "mypy>=1.15",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "tutor-core/tests", "tutor-api/tests"]
addopts = [
    "--cov=tutor_core",
    "--cov=tutor_api",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
markers = [
    "requires_ollama: reaches the local Ollama runtime (skipped if unavailable)",
]
filterwarnings = [
    "ignore:testcontainers.postgres is deprecated:DeprecationWarning",
    # Starlette 1.6 prefers httpx2 for its TestClient; httpx is still correct.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
# SQLAlchemy resumes an awaited statement on a greenlet. Lines after that
# resume are invisible unless the greenlet tracer is on. ``thread`` stays
# so the FastAPI tests keep the default tracer.
concurrency = ["greenlet", "thread"]
source = ["tutor_core", "tutor_api"]
omit = ["*/tests/*", "*/fixtures/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["tutor_core", "tutor_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "tutor_api",
    "tutor_core.application",
    "tutor_core.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no frameworks"
type = "forbidden"
source_modules = ["tutor_core.domain"]
forbidden_modules = [
    "tutor_api",
    "fastapi",
    "starlette",
    "langgraph",
    "langchain",
    "sqlalchemy",
    "httpx",
    "psycopg",
    "ollama",
    "testcontainers",
]

[[tool.importlinter.contracts]]
name = "Application does not import the API package"
type = "forbidden"
source_modules = ["tutor_core.application"]
forbidden_modules = ["tutor_api"]
