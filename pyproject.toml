[project]
name = "supervised-two-agent-tutor"
version = "0.1.0"
description = "Compliance-evidence prototype for EU AI Act Articles 10, 12, 14 and 15."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tutor-core",
    "tutor-api",
]

[tool.uv]
required-version = ">=0.12.5"

# Pylint does not read pytest's pythonpath. These roots match it, so
# tutor_core stays first-party beside tutor_api (ruff known-first-party).
[tool.pylint.main]
source-roots = ["tutor-core/src", "tutor-api/src"]

[tool.pylint.imports]
known-first-party = ["tutor_core", "tutor_api"]
init-hook = "import sys; from pathlib import Path; root = next((p for p in [Path.cwd(), *Path.cwd().parents] if (p / 'uv.lock').is_file()), None); sys.path[:0] = [str(root / 'tutor-core' / 'src'), str(root / 'tutor-api' / 'src')] if root is not None else []"

[tool.uv.workspace]
members = ["tutor-core", "tutor-api"]

[tool.uv.sources]
tutor-core = { workspace = true }
tutor-api = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.3",
    "mypy>=1.15",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
# The src roots are explicit so the suite does not depend on the editable
# .pth files, which Python skips once macOS flags them hidden (gh-113659).
pythonpath = [".", "tutor-core/src", "tutor-api/src"]
testpaths = ["tests", "tutor-core/tests", "tutor-api/tests"]
addopts = [
    "--cov=tutor_core",
    "--cov=tutor_api",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
    # Starts the real sandbox compose project; `make sandbox-lifecycle` runs it.
    "-m",
    "not sandbox_lifecycle",
]
asyncio_mode = "auto"
markers = [
    "requires_ollama: reaches the local Ollama runtime (skipped if unavailable)",
    "sandbox_lifecycle: starts the throwaway compose project; only make sandbox-lifecycle runs it",
]
filterwarnings = [
    "ignore:testcontainers.postgres is deprecated:DeprecationWarning",
    # Starlette 1.6 prefers httpx2 for its TestClient; httpx is still correct.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
# SQLAlchemy resumes an awaited statement on a greenlet. Lines after that
# resume are invisible unless the greenlet tracer is on. ``thread`` stays
# so the FastAPI tests keep the default tracer.
concurrency = ["greenlet", "thread"]
source = ["tutor_core", "tutor_api"]
omit = ["*/tests/*", "*/fixtures/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["tutor_core", "tutor_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "tutor_api",
    "tutor_core.application",
    "tutor_core.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no frameworks"
type = "forbidden"
source_modules = ["tutor_core.domain"]
forbidden_modules = [
    "tutor_api",
    "fastapi",
    "starlette",
    "langgraph",
    "langchain",
    "sqlalchemy",
    "httpx",
    "psycopg",
    "ollama",
    "testcontainers",
]

[[tool.importlinter.contracts]]
name = "Application does not import the API package"
type = "forbidden"
source_modules = ["tutor_core.application"]
forbidden_modules = ["tutor_api"]
